# Builds the application, both ways, and publishes them as one release.
#
# Two artifacts from one build of the web application, because the product is one
# thing packaged twice:
#
#   - the **PWA**: a directory of static files a browser installs as an
#     application — desktop, phone or headset — talking to Exasol over a socket
#     from wherever it is served. No server to deploy, which is why it is a zip.
#   - the **desktop application**: the same `dist`, in a window of its own, with
#     no browser and nothing to install first. `apps/desktop`, built by Tauri.
#
# The order is the point. The gate is the same `npm run verify` a developer runs;
# then the web application is built *once*; then the installability probe is
# pointed at that build rather than making its own. So the bytes driven in a
# browser — worker registered, manifest and icons checked, network taken away,
# application launched again — are the bytes in the zip, and the desktop job
# rebuilds the same source on each platform's own runner because a bundle can only
# be made by the operating system it is for.
#
# The PWA installs from any HTTPS origin; the build is relative, so an origin's
# root and a subdirectory are the same artifact (see pages.yml, which proves it by
# serving under a path before deploying).
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Build and check, but publish nothing'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  pwa:
    name: build, check, publish the PWA
    runs-on: ubuntu-latest
    # The desktop job needs the version, and needs the release to exist before it
    # can add anything to it.
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # A tag that disagrees with the manifest ships an artifact whose own name
      # is wrong. Caught here rather than discovered by whoever downloads it.
      - name: Work out the version, and insist the tag agrees with it
        id: version
        run: |
          declared="$(node -p 'require("./package.json").version')"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tagged="${GITHUB_REF_NAME#v}"
            if [ "$tagged" != "$declared" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${declared}. Bump one of them."
              exit 1
            fi
          fi
          echo "value=${declared}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${declared}"

      # The same gate as a developer's, and the reason a release cannot ship
      # something the suite rejects.
      - name: Verify
        run: npm run verify

      - name: Build the application
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      # Pointed at the build above rather than making its own: what is checked
      # has to be what is shipped, or the check is about a different artifact.
      - name: Drive the built application in a browser
        env:
          PANORAMA_SKIP_BUILD: '1'
        run: npm run install-check

      - name: Package it
        id: package
        run: |
          version="${{ steps.version.outputs.value }}"
          name="exasol-panorama-pwa-${version}"
          cp LICENSE apps/web/dist/LICENSE
          cat > apps/web/dist/SERVING.md <<'NOTE'
          # Serving Panorama

          These are the whole application: static files, no server of their own.

          1. Copy this directory to the **root** of an HTTPS origin. The root is
             not a preference — a service worker's scope is the directory it is
             served from, and the manifest names `/` as the start URL.
          2. Serve `.webmanifest` as `application/manifest+json` and `.js` as
             `text/javascript`. Most hosts do; some need telling.
          3. Do not cache `index.html` or `service-worker.js` at the edge for
             long. Everything under `assets/` is content-hashed and safe to cache
             forever.

          Then open the origin and use the browser's install control. It will
          launch in its own window and start with no network, because the
          application is on the device. A database, of course, is not.

          Panorama connects to Exasol directly over `wss://`. A browser refuses
          that handshake to a host whose certificate it does not trust and never
          offers an exception, so the instance needs a certificate the browser
          accepts.
          NOTE
          (cd apps/web/dist && zip -qr "../../../${name}.zip" .)
          sha256sum "${name}.zip" > "${name}.zip.sha256"
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          ls -lh "${name}.zip"

      - name: Keep the artifact whatever happens next
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.name }}.zip
            ${{ steps.package.outputs.name }}.zip.sha256
          retention-days: 90

      # Only for a tag, and never for a dry run: a release is the one step here
      # that is visible outside this workflow.
      - name: Publish the release
        if: github.ref_type == 'tag' && inputs.dry-run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          name="${{ steps.package.outputs.name }}"
          {
            echo "Panorama ${version}, as an installable application."
            echo
            echo "\`${name}.zip\` is the built application: static files to copy to the"
            echo "root of an HTTPS origin, then install from the browser. \`SERVING.md\`"
            echo "inside it says what a host has to get right."
            echo
            echo "Built from ${GITHUB_SHA} and driven in Chromium before packaging:"
            echo "service worker registered and activated, manifest and every icon"
            echo "checked against the files, and the application launched again with"
            echo "the network taken away."
          } > notes.md
          gh release create "${GITHUB_REF_NAME}" \
            --title "Panorama ${version}" \
            --notes-file notes.md \
            "${name}.zip" "${name}.zip.sha256"

  # One job per operating system, because a bundle is made by the platform it is
  # for: an `.app` and a `.dmg` need macOS, an installer needs Windows, and a
  # `.deb` needs the distribution's own libraries.
  #
  # `needs: pwa` is doing two things. It carries the version across, and it means
  # the release already exists by the time anything here tries to add a file to it
  # — which also makes the gate (`verify`, and the probe) a gate on these bundles
  # as well, without running it three more times.
  desktop:
    name: desktop application (${{ matrix.label }})
    needs: pwa
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing to bundle should not withdraw the others: a release
      # with two of three desktop artifacts and a known gap beats no release.
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS
            # One bundle for both architectures. The runner is Apple silicon, so
            # the Intel half has to be asked for explicitly.
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin x86_64-apple-darwin
          # `latest` rather than a pinned image: the pinned ones are retired on a
          # schedule, and the only thing that follows from the choice is the glibc
          # a `.deb` and an AppImage are built against. Pin it the day that
          # matters, not before.
          - os: ubuntu-latest
            label: Linux
            args: ''
            targets: ''
          # Produces two artifacts, which is Tauri's default for this platform and
          # worth having both of: an NSIS installer (`…-setup.exe`, per-user, no
          # administrator) and an MSI for whoever deploys by policy. WiX and NSIS
          # are fetched by the bundler on first use; the runner already has MSVC and
          # WebView2.
          - os: windows-latest
            label: Windows
            args: ''
            targets: ''
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # WebKitGTK is the webview on Linux, and the rest are what the bundler
      # needs to write a `.deb` and an AppImage.
      - name: Linux webview and bundler libraries
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf file libssl-dev

      # rustup is already on every runner, so there is no third-party action here
      # to trust with a toolchain.
      # `shell: bash` because the Windows runner would otherwise use PowerShell,
      # and rustup is the one step here written as a shell script.
      - name: Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          # Only where the matrix asks for one: `rustup target add` with no
          # argument is an error, and most rows want the host's own target.
          if [ -n "${{ matrix.targets }}" ]; then rustup target add ${{ matrix.targets }}; fi

      - name: Cache the Rust build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            apps/desktop/src-tauri/target
          key: cargo-${{ matrix.os }}-${{ hashFiles('apps/desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.os }}-

      - run: npm ci

      # The same web build the PWA ships, made again here rather than passed
      # between jobs: it is deterministic from the source, and an artifact
      # download is one more thing to get wrong.
      - name: Build the web application
        run: npm run build

      # The shell's own tests: the guards on the endpoint, the session file, and
      # the pipe's decisions. Cheap here, because the toolchain and most of the
      # build are already warm.
      - name: Test the shell
        working-directory: apps/desktop/src-tauri
        run: cargo test

      # Signed and notarised when this repository holds the secrets, ad-hoc signed
      # when it does not — which is what the artifacts are today, and why macOS
      # asks about them on a machine that did not build them.
      #
      # To turn it on, add these repository secrets and nothing else changes:
      #   APPLE_CERTIFICATE           a Developer ID Application .p12, base64
      #   APPLE_CERTIFICATE_PASSWORD  its password
      #   APPLE_SIGNING_IDENTITY      e.g. "Developer ID Application: Exasol (TEAMID)"
      #   APPLE_ID, APPLE_PASSWORD    an Apple ID and an app-specific password
      #   APPLE_TEAM_ID               for notarisation
      # Windows needs a certificate thumbprint in tauri.conf.json instead; there is
      # no environment-only route for it, so it is a separate decision.
      # Two different signatures, for two different questions. The `APPLE_*` ones
      # are about Gatekeeper trusting the application; `TAURI_SIGNING_*` is about
      # an installed Panorama trusting the bytes of its own update, and without it
      # `createUpdaterArtifacts` fails the build rather than producing unsigned
      # ones — the updater cannot be told to skip the check. So the flag is passed
      # only when the key is here, and a repository without it still releases,
      # minus the ability to update what it released.
      - name: Bundle the desktop application
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: bash
        run: |
          # An absent secret is not an absent variable: it arrives as an empty
          # string, and the bundler reads "set" as "sign with this" — then fails
          # importing a certificate that is not there. Unset rather than empty is
          # the difference between an unsigned build and no build at all.
          if [ -z "${APPLE_CERTIFICATE}" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY}" ]; then
            npm run build --workspace @panorama/desktop -- ${{ matrix.args }} \
              --config '{"bundle":{"createUpdaterArtifacts":true}}'
          else
            echo "::warning::No TAURI_SIGNING_PRIVATE_KEY: this build ships, but nothing can update to it."
            npm run build --workspace @panorama/desktop -- ${{ matrix.args }}
          fi

      # Said out loud, because "unsigned" is the difference between an application
      # somebody can open and one macOS refuses until they know the trick.
      - name: Say whether it was signed
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          app="$(find apps/desktop/src-tauri/target -name '*.app' -maxdepth 5 | head -1)"
          codesign -dvv "$app" 2>&1 | grep -E 'Authority|Signature' || true
          if [ -z "${{ secrets.APPLE_SIGNING_IDENTITY }}" ]; then
            echo "::warning::Built ad-hoc signed: this repository holds no Developer ID secrets, so first launch needs right-click -> Open."
          fi

      # The signatures are named one by one rather than swept up as `*.sig`,
      # because the bundler signs everything it makes — including an RPM this
      # workflow does not publish, whose signature would then sit in the release
      # as a signature for a file that is not there. Only the four an updater
      # actually reads are wanted.
      #
      # Collected by searching rather than by naming paths, which differ per
      # platform and per target triple: a `.dmg` on macOS, a `.deb` and an AppImage
      # on Linux, an NSIS `-setup.exe` and an `.msi` on Windows. Installers only —
      # the unpacked `.app` and the raw executable are inside them. Spaces out of the names on the way —
      # the application is called "Exasol Panorama" and a downloaded file should
      # not be.
      - name: Collect the bundles
        shell: bash
        run: |
          mkdir -p desktop-artifacts
          find apps/desktop/src-tauri/target -path '*/release/bundle/*' \
            \( -name '*.dmg' -o -name '*.deb' -o -name '*.AppImage' -o -name '*.msi' -o -name '*.exe' \
               -o -name '*.app.tar.gz' \
               -o -name '*.app.tar.gz.sig' -o -name '*.AppImage.sig' \
               -o -name '*-setup.exe.sig' -o -name '*.msi.sig' \) \
            -print0 |
            while IFS= read -r -d '' bundle; do
              cp "$bundle" "desktop-artifacts/$(basename "$bundle" | tr ' ' '-')"
            done
          ls -lh desktop-artifacts

      - name: Keep the artifact whatever happens next
        uses: actions/upload-artifact@v4
        with:
          name: exasol-panorama-desktop-${{ needs.pwa.outputs.version }}-${{ matrix.label }}
          path: desktop-artifacts/*
          retention-days: 90

      # Added to the release the PWA job created. Unsigned, and the notes say so:
      # signing and notarisation need certificates this repository does not hold.
      - name: Add them to the release
        if: github.ref_type == 'tag' && inputs.dry-run != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" desktop-artifacts/* --clobber

  # The file an installed Panorama asks whether it is out of date. Last, because
  # it names every platform's bundle and their signatures, and those do not exist
  # until each platform has finished building its own.
  #
  # `if: always()` on purpose: one platform failing to bundle should publish a
  # manifest for the two that did rather than none for anybody. A platform missing
  # from it means "no update for you yet", which is true and harmless; a platform
  # in it without a signature would fail on the user's machine after the download.
  manifest:
    name: publish the update manifest
    needs: [pwa, desktop]
    if: always() && github.ref_type == 'tag' && inputs.dry-run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # From the release rather than from the build jobs' artifacts: what the
      # manifest points at is what was published, so it is built from that.
      - name: Collect what was published
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p published
          gh release download "${GITHUB_REF_NAME}" --dir published --pattern '*' || true
          ls -l published

      - name: Write it
        id: write
        shell: bash
        run: |
          if node scripts/update-manifest.mjs \
            --version "${{ needs.pwa.outputs.version }}" \
            --dir published --out latest.json; then
            echo "written=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No signed bundles, so no update manifest: this release ships, but nothing can update to it."
            echo "written=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Add it to the release
        if: steps.write.outputs.written == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" latest.json --clobber
