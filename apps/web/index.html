<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="A spatial canvas for exploring data in Exasol: tables, queries and charts side by side on one surface."
    />
    <title>Exasol Panorama</title>
    <!--
      Installable: the manifest is what lets a browser launch this without a tab,
      on a desktop, a phone or a headset. Nothing here changes how the page runs
      in a tab. See `docs/ARCHITECTURE.md` and `plans/panorama-packaging-plan.md`.
    -->
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#f1f3f5" />
    <link rel="icon" href="%BASE_URL%icons/icon-192.png" type="image/png" sizes="192x192" />
    <!-- iOS reads neither the manifest's icons nor its name for a home screen. -->
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-title" content="Panorama" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
