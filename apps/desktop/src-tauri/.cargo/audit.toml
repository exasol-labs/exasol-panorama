# What `cargo audit` is told to let through, and why. Read by the advisories
# workflow (.github/workflows/advisories.yml) and by `cargo audit` run here.
#
# Every entry is an advisory this crate cannot fix from where it stands, with the
# reason it is tolerable until it can. One that stops matching — because the crate
# carrying it moved on — is harmless, but delete it then: a list nobody prunes
# ends up waving through the next advisory with the same name.

[advisories]
ignore = []
